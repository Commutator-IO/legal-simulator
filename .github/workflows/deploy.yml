name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Les contrôles tournent aussi sur les pull requests ; seul le déploiement
  # est réservé à la branche main.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Jeton nécessaire au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `--deny-warnings` est indispensable : sans le drapeau, oxlint signale
      # les avertissements et sort avec le code 0 — cette étape ne pourrait
      # alors jamais échouer.
      - name: Lint
        run: npm run lint

      # Les dates d'application et les arbres de qualification ne partent pas
      # sans leurs tests : ce sont eux qui gardent l'exactitude juridique du
      # site. Vitest sort en erreur aussi bien sur un test rouge que lorsqu'il
      # ne trouve aucun fichier de test, donc la suite ne peut pas disparaître
      # en silence.
      - name: Unit tests
        run: npm test

      # `npm run build` enchaîne `tsc -b` puis `vite build` : une erreur de
      # typage fait échouer cette étape.
      #
      # Le site est servi depuis le domaine dédié legal.commutator.io, donc
      # depuis la racine : les assets ne doivent pas être préfixés et
      # BASE_PATH reste vide (vite.config.ts retombe alors sur "/").
      # Sans domaine personnalisé, un site de projet vit sous /<dépôt>/ et il
      # faudrait BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build
        run: npm run build

      # `enablement: true` provisionne Pages sur le dépôt s'il ne l'est pas
      # encore. Si la politique de l'organisation refuse au GITHUB_TOKEN le
      # droit de créer le site, le créer une fois à la main :
      #   gh api -X POST repos/Commutator-IO/legal-simulator/pages \
      #     -f "build_type=workflow"
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    # Une pull request ne déploie pas ; elle ne fait que passer les contrôles.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
